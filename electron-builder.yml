appId: com.baoguo.codexfree
productName: CodexFree
copyright: Copyright © 2026 BaoGuo
directories:
  buildResources: build
compression: maximum
electronLanguages:
  - en
  - zh_CN
publish: null
files:
  - out/**
  - resources/**
  - package.json
  - "!dist/**"
  - "!test/**"
  - "!**/*.har"
  - "!out/**/*.map"
asarUnpack:
  - node_modules/**/*.node
win:
  executableName: CodexFree
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: icon.icns
  identity: null
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  timestamp: null
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  icon: icon.png
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  maintainer: BaoGuo
  category: Development
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
