name: Release

"on":
  workflow_dispatch:
    inputs:
      prerelease:
        default: true
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
      release_notes:
        description: Markdown release notes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: com.baoguo.codexfree
  APP_NAME: CodexFree
  BUN_VERSION: 1.3.14
  VPK_VERSION: 1.2.0

jobs:
  prepare:
    name: Prepare release version and tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ github.event.inputs.prerelease }}
      tag: ${{ steps.package-version.outputs.tag }}
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: package-version
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const version = pkg.version
          if (typeof version !== 'string') {
            throw new Error('package.json version must be a string')
          }
          const semver = /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/
          if (!semver.test(version)) {
            throw new Error(`package.json version must be semver2: ${version}`)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`)
          NODE

      - name: Validate release tag
        env:
          TAG: ${{ steps.package-version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

      - name: Create release tag
        env:
          TAG: ${{ steps.package-version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

  build-macos:
    name: Build macOS full installers
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS packages
        run: bun run build:mac

      - name: Normalize macOS installer names
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for spec in \
            "x64|CodexFree-$VERSION-macos-x64.dmg" \
            "arm64|CodexFree-$VERSION-macos-arm64.dmg"
          do
            IFS='|' read -r arch target_name <<< "$spec"
            source_path="dist/CodexFree-$VERSION-$arch.dmg"
            target_path="dist/$target_name"
            if [[ ! -f "$source_path" ]]; then
              echo "Expected macOS installer missing: $source_path" >&2
              find dist -maxdepth 1 -type f | sort >&2
              exit 1
            fi
            mv "$source_path" "$target_path"
          done

      - name: Install Velopack CLI
        run: dotnet tool install --tool-path ./.tools vpk --version "$VPK_VERSION"

      - name: Prepare release notes
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES" > release-notes.md

      - name: Download previous macOS Velopack releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          : > previous-channels.txt
          for channel in osx-x64 osx-arm64; do
            args=(
              github
              --repoUrl "https://github.com/${{ github.repository }}"
              --token "$GH_TOKEN"
              --outputDir Releases
              --channel "$channel"
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--pre)
            fi
            if ./.tools/vpk download "${args[@]}"; then
              if node .github/scripts/has-velopack-full-release.mjs Releases "$channel"; then
                echo "$channel" >> previous-channels.txt
              fi
            fi
          done

      - name: Pack macOS Velopack releases
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for spec in \
            "osx-x64|dist/mac/CodexFree.app|build/icon.icns" \
            "osx-arm64|dist/mac-arm64/CodexFree.app|build/icon.icns"
          do
            IFS='|' read -r channel pack_dir icon <<< "$spec"
            if [[ ! -d "$pack_dir" ]]; then
              echo "Expected macOS app bundle missing: $pack_dir" >&2
              find dist -maxdepth 3 -type d | sort >&2
              exit 1
            fi
            ./.tools/vpk pack \
              --packId "$APP_ID" \
              --packTitle "$APP_NAME" \
              --packAuthors "BaoGuo" \
              --packVersion "$VERSION" \
              --packDir "$pack_dir" \
              --mainExe "$APP_NAME" \
              --runtime "$channel" \
              --channel "$channel" \
              --outputDir Releases \
              --icon "$icon" \
              --bundleId "$APP_ID" \
              --releaseNotes release-notes.md \
              --noInst
          done

      - name: Validate macOS delta packages
        run: |
          set -euo pipefail
          while IFS= read -r channel; do
            if [[ -z "$channel" ]]; then
              continue
            fi
            if ! find Releases -maxdepth 1 -type f -name "*-$channel-delta.nupkg" | grep -q .; then
              echo "Expected a delta package for previous macOS channel: $channel" >&2
              find Releases -maxdepth 1 -type f | sort >&2
              exit 1
            fi
          done < previous-channels.txt

      - name: Normalize macOS Velopack file names
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          find Releases -maxdepth 1 -type f ! -name '*.nupkg' ! -name 'releases.*.json' -delete
          find Releases -maxdepth 1 -type f -name '*.nupkg' ! -name "*-$VERSION-*" -delete
          for channel in osx-x64 osx-arm64; do
            node .github/scripts/normalize-velopack-assets.mjs Releases "$VERSION" "$channel"
          done

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          if-no-files-found: error
          path: |
            dist/*.dmg

      - name: Upload macOS Velopack artifact
        uses: actions/upload-artifact@v4
        with:
          name: velopack-osx
          if-no-files-found: error
          path: Releases/**

  build-velopack:
    name: Build ${{ matrix.name }} Velopack packages
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            channel: win-x64
            runtime: win-x64
            pack_dir: dist/win-unpacked
            main_exe: CodexFree.exe
            icon: build/icon.ico
            build_command: bun run clean:packaged-apps && bun run build && bun electron-builder --win --dir --x64
            pack_flags: --noPortable
          - name: Windows arm64
            runner: windows-latest
            channel: win-arm64
            runtime: win-arm64
            pack_dir: dist/win-arm64-unpacked
            main_exe: CodexFree.exe
            icon: build/icon.ico
            build_command: bun run clean:packaged-apps && bun run build && bun electron-builder --win --dir --arm64
            pack_flags: --noPortable
          - name: Linux x64
            runner: ubuntu-latest
            channel: linux-x64
            runtime: linux-x64
            pack_dir: dist/linux-unpacked
            main_exe: codexfree
            icon: build/icon.png
            build_command: bun run clean:packaged-apps && bun run build && bun electron-builder --linux --dir --x64
            pack_flags: ""
          - name: Linux arm64
            runner: ubuntu-latest
            channel: linux-arm64
            runtime: linux-arm64
            pack_dir: dist/linux-arm64-unpacked
            main_exe: codexfree
            icon: build/icon.png
            build_command: bun run clean:packaged-apps && bun run build && bun electron-builder --linux --dir --arm64
            pack_flags: ""
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build unpacked app
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install --tool-path ./.tools vpk --version "$VPK_VERSION"

      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES" > release-notes.md

      - name: Download previous Velopack release
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            github
            --repoUrl "https://github.com/${{ github.repository }}"
            --token "$GH_TOKEN"
            --outputDir Releases
            --channel "$CHANNEL"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--pre)
          fi
          : > previous-channel.txt
          if ./.tools/vpk download "${args[@]}"; then
            if node .github/scripts/has-velopack-full-release.mjs Releases "$CHANNEL"; then
              echo "$CHANNEL" > previous-channel.txt
            fi
          fi

      - name: Pack Velopack release
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          ICON: ${{ matrix.icon }}
          MAIN_EXE: ${{ matrix.main_exe }}
          PACK_FLAGS: ${{ matrix.pack_flags }}
          PACK_DIR: ${{ matrix.pack_dir }}
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ ! -e "$PACK_DIR/$MAIN_EXE" ]]; then
            detected_exe="$(find "$PACK_DIR" -maxdepth 1 -type f -perm -111 | head -n 1 || true)"
            if [[ -n "$detected_exe" ]]; then
              MAIN_EXE="$(basename "$detected_exe")"
            else
              echo "Expected main executable missing: $PACK_DIR/$MAIN_EXE" >&2
              find "$PACK_DIR" -maxdepth 2 -type f | sort >&2
              exit 1
            fi
          fi
          ./.tools/vpk pack \
            --packId "$APP_ID" \
            --packTitle "$APP_NAME" \
            --packAuthors "BaoGuo" \
            --packVersion "$VERSION" \
            --packDir "$PACK_DIR" \
            --mainExe "$MAIN_EXE" \
            --runtime "$RUNTIME" \
            --channel "$CHANNEL" \
            --outputDir Releases \
            --icon "$ICON" \
            --releaseNotes release-notes.md \
            $PACK_FLAGS

      - name: Validate delta package
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          if [[ -s previous-channel.txt ]]; then
            if ! find Releases -maxdepth 1 -type f -name "*-$CHANNEL-delta.nupkg" | grep -q .; then
              echo "Expected a delta package for previous channel: $CHANNEL" >&2
              find Releases -maxdepth 1 -type f | sort >&2
              exit 1
            fi
          fi

      - name: Normalize Velopack file names
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          find Releases -maxdepth 1 -type f -name 'assets.*.json' -delete
          find Releases -maxdepth 1 -type f -name 'RELEASES*' -delete
          find Releases -maxdepth 1 -type f -name '*.nupkg' ! -name "*-$VERSION-*" -delete
          node .github/scripts/normalize-velopack-assets.mjs Releases "$VERSION" "$CHANNEL"

      - name: Upload Velopack artifact
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.channel }}
          if-no-files-found: error
          path: Releases/**

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build-macos
      - build-velopack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release notes
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          args=(--title "CodexFree $VERSION" --notes-file release-notes.md --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

      - name: Upload macOS installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts/macos-packages -type f | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No macOS artifacts found" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Merge Velopack artifacts
        run: |
          set -euo pipefail
          mkdir -p Releases
          find artifacts -path '*/velopack-*/*' -type f -exec cp {} Releases/ \;
          find Releases -maxdepth 1 -type f | sort

      - name: Upload Velopack releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find Releases -maxdepth 1 -type f | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No Velopack artifacts found" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Validate published asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${assets[@]}"
          required=(
            "CodexFree-$VERSION-macos-x64.dmg"
            "CodexFree-$VERSION-macos-arm64.dmg"
            "CodexFree-$VERSION-macos-x64-update.nupkg"
            "CodexFree-$VERSION-macos-arm64-update.nupkg"
            "CodexFree-$VERSION-windows-x64-setup.exe"
            "CodexFree-$VERSION-windows-arm64-setup.exe"
            "CodexFree-$VERSION-windows-x64-update.nupkg"
            "CodexFree-$VERSION-windows-arm64-update.nupkg"
            "CodexFree-$VERSION-linux-x64.AppImage"
            "CodexFree-$VERSION-linux-arm64.AppImage"
            "CodexFree-$VERSION-linux-x64-update.nupkg"
            "CodexFree-$VERSION-linux-arm64-update.nupkg"
            "releases.osx-x64.json"
            "releases.osx-arm64.json"
            "releases.win-x64.json"
            "releases.win-arm64.json"
            "releases.linux-x64.json"
            "releases.linux-arm64.json"
          )
          missing=0
          for name in "${required[@]}"; do
            if ! printf '%s\n' "${assets[@]}" | grep -Fxq "$name"; then
              echo "Missing expected release asset: $name" >&2
              missing=1
            fi
          done
          forbidden_regex='(^com\.baoguo\.codexfree|^assets\.|^RELEASES|\.blockmap$|Portable\.zip$|-full\.nupkg$)'
          if printf '%s\n' "${assets[@]}" | grep -E "$forbidden_regex"; then
            echo "Release contains forbidden legacy asset names" >&2
            missing=1
          fi
          exit "$missing"
